<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Shahjahan Miss</title>
    
    <!-- Premium Google Fonts Links -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- Link to the external CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Infinite Background Music Engine Tracking -->
    <audio id="bg-music-engine" src="music.mp3" loop></audio>

    <!-- Continuous Background Container for Flowers -->
    <div id="flower-layer"></div>

    <!-- ==========================================
       PAGE 1: RECEPTION HERO (DODGES 5 TIMES - CAT THEME)
    ========================================== -->
    <div id="page-1" class="interactive-screen-panel screen-fade-active">
        <h1 class="main-title-header">
            For <span class="letter-s-wrapper"><span class="ribbon-emoji">🎀</span>S</span>hahjahan Miss
        </h1>
        
        <!-- Premium Button Component with Local gif1.gif Link -->
        <button id="btn-open-card" class="action-trigger-btn prank-btn">
            <span class="btn-primary-label">Open</span>
            <div class="premium-gif-badge display-hidden-state">
                <img src="gif1.gif" alt="Cat GIF">
                <span class="gif-sub-caption">Try Again miss</span>
            </div>
        </button>
    </div>

    <!-- ==========================================
       PAGE 2: GREETING WISH CARD (DODGES 4 TIMES - DOG THEME)
    ========================================== -->
    <div id="page-2" class="interactive-screen-panel display-hidden-state">
        <div class="wish-card-container">
            <h2 class="wish-card-heading">HAPPY TEACHER'S DAY</h2>
            <p class="wish-card-message">
                thank you for being such an incredible guide and inspiring presence in our lives. your patience, kindness, and dedication make a difference every single day. we are truly grateful for everything you do to help us learn and grow.
            </p>
            
            <!-- Premium Button Component with Local gif2.gif Link -->
            <button id="btn-read-letter" class="action-trigger-btn prank-btn">
                <span class="btn-primary-label">Continue</span>
                <div class="premium-gif-badge display-hidden-state">
                    <img src="gif2.gif" alt="Dog GIF">
                    <span class="gif-sub-caption">Try Again miss</span>
                </div>
            </button>
        </div>
    </div>

    <!-- ==========================================
       PAGE 3: TYPEWRITER NOTE VIEW (DODGES 3 THEN 2 TIMES - RABBIT THEME)
    ========================================== -->
    <div id="page-3" class="interactive-screen-panel display-hidden-state">
        <h2 class="letter-section-title">a letter for you</h2>
        
        <!-- Premium Wax Seal Envelope Box View -->
        <div id="envelope-view-box" class="envelope-graphic-box">
            <div class="premium-envelope-badge">
                <div class="wax-seal"></div>
                <div class="seal-ribbon ribbon-left"></div>
                <div class="seal-ribbon ribbon-right"></div>
            </div>
            
            <!-- Envelope Button using Local gif3.gif Link -->
            <button id="btn-open-envelope" class="action-trigger-btn prank-btn">
                <span class="btn-primary-label">Open Letter</span>
                <div class="premium-gif-badge display-hidden-state">
                    <img src="gif3.gif" alt="Rabbit GIF">
                    <span class="gif-sub-caption">Try Again miss</span>
                </div>
            </button>
        </div>

        <!-- Cream Paper Sheet Block Structure -->
        <div id="paper-letter-sheet" class="paper-letter-sheet display-hidden-state">
            <div id="typewriter-output-target" class="typewriter-animated-text"></div>
        </div>

        <!-- OUTSIDE FLOATING PRANK BUTTON using Local gif4.gif Link -->
        <button id="btn-letter-continue" class="action-trigger-btn letter-btn-hidden prank-btn isolated-outside-btn">
            <span class="btn-primary-label">Continue</span>
            <div class="premium-gif-badge display-hidden-state">
                <img src="gif4.gif" alt="Continue GIF">
                <span class="gif-sub-caption">Try Again miss</span>
            </div>
        </button>
    </div>

    <!-- ==========================================
       PAGE 4: GRAND FINALE HOLDER
    ========================================== -->
    <div id="page-4" class="interactive-screen-panel display-hidden-state">
        <!-- Ready for your final Page 4 parameters right inside here next! -->
    </div>

    <!-- Link to the external JavaScript Logic File -->
    <script src="script.js"></script>
</body>
</html>
